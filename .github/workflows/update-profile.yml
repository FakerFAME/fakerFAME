name: Update Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Regenerate data and SVG assets
        run: |
          python scripts/fetch_contributions.py
          python scripts/generate_ascii.py
          python scripts/render_info_card.py
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
          python scripts/validate.py

      - name: Commit changes (if needed)
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/*.svg
          git commit -m "chore: refresh profile assets"
          git push
